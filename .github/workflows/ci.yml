name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and static checks (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q decemsg tests

      - name: Ruff check
        run: python -m ruff check tests

      - name: Pytest
        run: python -m pytest -q

      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt --ignore PYSEC-2026-1325

  security-regression:
    name: Security regression test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run security-tagged tests
        run: python -m pytest -q -m security

  web-crypto:
    name: Browser crypto build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install browser dependencies
        working-directory: web
        run: npm ci

      - name: Verify pinned crypto package
        working-directory: web
        run: npm run verify-crypto-package

      - name: Run Alice-to-Bob E2EE smoke test
        working-directory: web
        run: npm run crypto-smoke

      - name: Build browser crypto staging tree
        working-directory: web
        run: npm run build

      - name: Verify build manifest and WASM payload
        working-directory: web
        run: |
          test -f dist/BUILD_MANIFEST.json
          test -f dist/vendor/matrix-sdk-crypto-wasm/pkg/matrix_sdk_crypto_wasm_bg.wasm
